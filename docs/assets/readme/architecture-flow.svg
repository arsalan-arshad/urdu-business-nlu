<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">urdu-business-nlu architecture: propose → validate → route</title>
  <desc id="desc">Message text flows into rules-only propose, then a deterministic validator, then auto, confirm, or reject. Optional LLM is BYOK and later.</desc>
  <defs>
    <pattern id="paper" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#f5f0e8"/>
      <circle cx="1" cy="2" r="0.4" fill="#e8e0d4" opacity="0.5"/>
      <circle cx="5" cy="6" r="0.35" fill="#e8e0d4" opacity="0.4"/>
    </pattern>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1c1917"/>
    </marker>
    <marker id="arrTeal" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="960" height="280" fill="url(#paper)"/>
  <rect x="0" y="0" width="6" height="280" fill="#0f766e"/>

  <text x="28" y="36" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#1c1917">propose → validate → route</text>
  <text x="28" y="56" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#57534e">Rules-only v0 (M3 GO) · optional LLM later (BYOK) · silent-error focus</text>

  <!-- Message -->
  <rect x="28" y="96" width="148" height="72" rx="4" fill="#fffdf8" stroke="#1c1917" stroke-width="1.75"/>
  <text x="102" y="126" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1c1917">Message</text>
  <text x="102" y="146" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#78716c">Urdu / Roman-Urdu</text>

  <line x1="176" y1="132" x2="214" y2="132" stroke="#1c1917" stroke-width="1.75" marker-end="url(#arr)"/>

  <!-- Propose -->
  <rect x="220" y="96" width="158" height="72" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.75"/>
  <text x="299" y="124" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#134e4a">Propose</text>
  <text x="299" y="144" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#0f766e">rules-only · LLM*</text>

  <line x1="378" y1="132" x2="416" y2="132" stroke="#0f766e" stroke-width="1.75" marker-end="url(#arrTeal)"/>

  <!-- Validator -->
  <rect x="422" y="88" width="188" height="88" rx="4" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="516" y="122" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#7c2d12">Deterministic validator</text>
  <text x="516" y="144" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#9a3412">qty / amount / date ⊆ input</text>
  <text x="516" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#a8a29e">AI proposes · validator decides</text>

  <line x1="610" y1="110" x2="668" y2="72" stroke="#1c1917" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="610" y1="132" x2="668" y2="132" stroke="#1c1917" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="610" y1="154" x2="668" y2="192" stroke="#1c1917" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Routes -->
  <rect x="674" y="52" width="120" height="40" rx="3" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
  <text x="734" y="77" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#14532d">auto</text>

  <rect x="674" y="112" width="120" height="40" rx="3" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
  <text x="734" y="137" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#7c2d12">confirm</text>

  <rect x="674" y="172" width="120" height="40" rx="3" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="734" y="197" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#7f1d1d">reject</text>

  <text x="820" y="77" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#57534e">grounded + clear</text>
  <text x="820" y="137" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#57534e">uncertain → human</text>
  <text x="820" y="197" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#57534e">ungrounded number</text>

  <text x="28" y="246" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#57534e">* Optional LLM adapter is integrator-supplied (BYOK) and out of v0 core. Rules-only path: offline, no network in library code.</text>
  <text x="28" y="264" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#78716c">Prefer confirm over a silent wrong quantity or amount. No production accuracy % outside linked eval reports.</text>
</svg>
