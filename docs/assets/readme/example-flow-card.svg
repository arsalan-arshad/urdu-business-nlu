<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic example: input ? candidate ? confirm</title>
  <desc id="desc">Synthetic Roman-Urdu order with ambiguous kal routes to confirm. Placeholders only; not a product screenshot.</desc>
  <defs>
    <pattern id="paper2" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#f5f0e8"/>
      <circle cx="1" cy="2" r="0.4" fill="#e8e0d4" opacity="0.5"/>
      <circle cx="5" cy="6" r="0.35" fill="#e8e0d4" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="760" height="460" fill="url(#paper2)"/>
  <rect x="0" y="0" width="6" height="460" fill="#0f766e"/>

  <text x="28" y="36" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#1c1917">Example I/O (synthetic)</text>
  <text x="28" y="56" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#9a3412">placeholders only · owner_confirmed gold pattern · not a live chat screenshot</text>

  <!-- Input -->
  <rect x="28" y="78" width="704" height="78" rx="4" fill="#fffdf8" stroke="#1c1917" stroke-width="1.5"/>
  <text x="44" y="102" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.04em" fill="#57534e">INPUT</text>
  <text x="44" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#1c1917">"2 carton 500ml aur aik carton 1 litre kal bhej dena"</text>

  <path d="M380 164 L380 186" stroke="#1c1917" stroke-width="1.5"/>
  <path d="M374 180 L380 190 L386 180" fill="none" stroke="#1c1917" stroke-width="1.5"/>

  <!-- Candidate -->
  <rect x="28" y="198" width="704" height="140" rx="4" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.5"/>
  <text x="44" y="222" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.04em" fill="#0f766e">CANDIDATE (rules-only propose)</text>
  <text x="44" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#134e4a">intent: order</text>
  <text x="44" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#134e4a">lines: [{qty:2, unit:carton…}, {qty:1, unit:carton…}]</text>
  <text x="44" y="294" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#134e4a">due.expr: "kal" · due.date: null · due.ambiguous: true</text>
  <text x="44" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#134e4a">party: PARTY_A</text>

  <path d="M380 346 L380 368" stroke="#1c1917" stroke-width="1.5"/>
  <path d="M374 362 L380 372 L386 362" fill="none" stroke="#1c1917" stroke-width="1.5"/>

  <!-- Route -->
  <rect x="28" y="380" width="704" height="56" rx="4" fill="#ffedd5" stroke="#c2410c" stroke-width="1.75"/>
  <text x="44" y="404" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#9a3412">VALIDATOR ? route: confirm</text>
  <text x="44" y="424" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#7c2d12">ambiguous "kal" without tense · prefer confirm over a silent wrong date</text>
</svg>
